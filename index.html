<!DOCTYPE html>
<html lang="en" ng-app="selfTracker">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Self Tracker – Software Engineer</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body ng-controller="MainController">

  <!-- Login page renders outside the shell -->
  <div ng-if="!currentUser">
    <ng-view></ng-view>
  </div>

  <!-- App shell shown after login -->
  <div class="app-shell" ng-if="currentUser">

    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <h2>&#128200; Self Tracker</h2>
        <span>Software Engineer Tool</span>
      </div>

      <div class="sidebar-nav">
        <ul>
          <li>
            <a href="#!/dashboard" ng-class="{active: isActive('/dashboard')}">
              <span class="nav-icon">&#127968;</span> Dashboard
            </a>
          </li>
          <li>
            <a href="#!/tasks" ng-class="{active: isActive('/tasks')}">
              <span class="nav-icon">&#9989;</span> My Tasks
            </a>
          </li>
          <li>
            <a href="#!/skills" ng-class="{active: isActive('/skills')}">
              <span class="nav-icon">&#127775;</span> My Skills
            </a>
          </li>
          <li>
            <a href="#!/goals" ng-class="{active: isActive('/goals')}">
              <span class="nav-icon">&#127919;</span> My Goals
            </a>
          </li>
          <li ng-if="isManager()">
            <a href="#!/employees" ng-class="{active: isActive('/employees')}">
              <span class="nav-icon">&#128101;</span> Team Overview
            </a>
          </li>
        </ul>
      </div>

      <div class="sidebar-footer">
        <div class="user-chip">
          <div class="avatar">{{currentUser.avatar}}</div>
          <div class="user-chip-info">
            <strong>{{currentUser.name}}</strong>
            <small>{{currentUser.role}}</small>
          </div>
        </div>
        <button class="btn-logout" ng-click="logout()">&#9889; Logout</button>
      </div>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
      <div class="topbar">
        <h1 ng-bind="pageTitle">Dashboard</h1>
        <div class="topbar-meta">
          {{currentUser.title}} &bull; {{currentUser.department}}
        </div>
      </div>
      <div class="page-body">
        <ng-view></ng-view>
      </div>
    </div>

  </div>

  <!-- AngularJS & angular-route from CDN -->
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular-route.min.js"></script>

  <!-- App module & routing -->
  <script src="app/app.js"></script>

  <!-- Services -->
  <script src="app/services/DataService.js"></script>
  <script src="app/services/FileService.js"></script>

  <!-- Include LoginController before other controllers -->
  <script src="app/controllers/LoginController.js"></script>
  <script src="app/controllers/MainController.js"></script>
  <script src="app/controllers/DashboardController.js"></script>
  <script src="app/controllers/TaskController.js"></script>
  <script src="app/controllers/SkillController.js"></script>
  <script src="app/controllers/GoalController.js"></script>
  <script src="app/controllers/EmployeeController.js"></script>
  <script src="app/controllers/ProfileController.js"></script>

</body>
</html>
